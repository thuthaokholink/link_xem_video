<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khu vực bảo mật</title>
    <!-- Sử dụng Google Fonts và Tailwind CSS để giao diện đẹp mắt, hiện đại -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white/10 backdrop-blur-lg border border-white/20 p-8 rounded-2xl shadow-2xl w-full max-w-md text-center text-white">
        <div class="mb-6">
            <div class="w-16 h-16 bg-purple-600/30 border border-purple-400/30 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-purple-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-wide">Nhập Mật Mã</h1>
            <p class="text-slate-300 text-sm mt-1">Vui lòng nhập mật mã riêng của bạn để tiếp tục</p>
        </div>

        <form onsubmit="checkPassword(event)" class="space-y-4">
            <div>
                <input type="password" id="passwordInput" placeholder="Nhập mật mã..." required
                    class="w-full px-4 py-3 bg-black/30 border border-white/20 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/50 transition duration-200 text-center tracking-widest text-lg">
            </div>
            <button type="submit"
                class="w-full py-3 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-purple-600/30 transition duration-200 transform active:scale-95">
                Xác Nhận
            </button>
        </form>

        <p id="errorMsg" class="text-red-400 text-sm mt-4 hidden font-medium">Mật mã không chính xác. Vui lòng thử lại!</p>
    </div>

    <script>
        // Cấu hình danh sách mật mã và đường link tương ứng của bạn ở đây
        const secretLinks = {
            "matma123": "https://example.com/link-so-1",
            "abcxyz": "https://example.com/link-so-2",
            "vip2026": "https://google.com"
        };

        function checkPassword(event) {
            event.preventDefault();
            const inputVal = document.getElementById("passwordInput").value.trim();
            const errorMsg = document.getElementById("errorMsg");

            if (secretLinks[inputVal]) {
                // Nếu mật mã đúng, chuyển hướng đến đường link tương ứng
                window.location.href = secretLinks[inputVal];
            } else {
                // Nếu sai, hiện thông báo lỗi và hiệu ứng lắc nhẹ
                errorMsg.classList.remove("hidden");
                const card = document.querySelector(".max-w-md");
                card.classList.add("animate-bounce");
                setTimeout(() => card.classList.remove("animate-bounce"), 500);
            }
        }
    </script>
</body>
</html>
